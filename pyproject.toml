[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "comparador-planilhas"
version = "1.0.0"
description = "Ferramenta para comparação de planilhas Excel com foco em segurança e usabilidade"
readme = "README.md"
authors = [
    {name = "Seu Nome", email = "seu.email@exemplo.com"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Office/Business",
    "Topic :: Security",
]
keywords = ["excel", "comparison", "security", "lgpd", "gui", "pyqt"]

[project.scripts]
comparador = "src.cli:main"
comparador-gui = "src.main:main"

[dependencies]
python = "^3.10"
pandas = "^2.0.3"
openpyxl = "^3.1.2"
pydantic = "^2.3.0"
python-dateutil = "^2.8.2"
python-dotenv = "^1.0.0"
loguru = "^0.7.2"
cryptography = "^41.0.3"
PyQt6 = "^6.5.0"
PyQt6-Qt6 = "^6.5.2"
PyQt6-sip = "^13.5.0"
xlrd = "^2.0.1"

[group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-qt = "^4.2.0"
pytest-xdist = "^3.3.1"
black = "^23.7.0"
isort = "^5.12.0"
flake8 = "^6.1.0"
mypy = "^1.5.0"
bandit = "^1.7.0"
pylint = "^3.0.2"
pre-commit = "^3.5.0"
pyinstaller = "^6.3.0"
sphinx = "^7.2.6"
sphinx-rtd-theme = "^2.0.0"
types-python-dateutil = "^2.8.19.14"
types-pytz = "^2023.3.0.0"

[project.urls]
"Homepage" = "https://github.com/seu-usuario/comparador-planilhas"
"Repository" = "https://github.com/seu-usuario/comparador-planilhas.git"
"Issues" = "https://github.com/seu-usuario/comparador-planilhas/issues"

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=src --cov-report=term-missing --cov-report=html"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv", "docs"]
skips = ["B101", "B311"]

[tool.pylint]
max-line-length = 100
disable = ["C0114", "C0115", "C0116"]